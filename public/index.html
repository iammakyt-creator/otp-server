<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Management Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0e14; color: #e1e7ec; min-height: 100vh; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1e2638; padding-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 700; color: #7289da; }
        .header span { font-size: 13px; color: #8a96a3; background: #161c28; padding: 6px 12px; border-radius: 6px; border: 1px solid #242f44; }
        
        .grid { display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        .card { background: #121722; border: 1px solid #1e2638; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card h2 { font-size: 16px; margin-bottom: 20px; color: #fff; border-bottom: 1px solid #1a2233; padding-bottom: 10px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #8a96a3; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select { width: 100%; background: #080a0f; border: 1px solid #242f44; padding: 10px 14px; color: #fff; border-radius: 6px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #7289da; }

        .btn { width: 100%; background: #7289da; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:hover { background: #5b6eae; }
        .btn-danger { background: #e74c3c; padding: 6px 12px; font-size: 12px; width: auto; }
        .btn-danger:hover { background: #c0392b; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #161c28; color: #8a96a3; font-size: 12px; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid #1e2638; }
        td { padding: 14px 16px; border-bottom: 1px solid #161c28; font-size: 13px; }
        tr:hover { background: #161c2b; }

        .code-tag { font-family: monospace; font-size: 15px; font-weight: 700; color: #00ffaa; background: rgba(0,255,170,0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(0,255,170,0.2); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge-active { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
        .badge-used { background: rgba(241, 196, 15, 0.15); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.3); }
        .badge-expired { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
    </style>
</head>
<body>

    <div class="header">
        <h1>OTP Verification Control Dashboard</h1>
        <span>Status: <strong style="color:#2ecc71;">ONLINE</strong></span>
    </div>

    <div class="grid">
        <!-- Generator Form -->
        <div class="card">
            <h2>Generate New OTP</h2>
            <div class="form-group">
                <label>Usage Type</label>
                <select id="otpType">
                    <option value="single">Single Use (One-Time Key)</option>
                    <option value="multi">Multi Use (Reusable Key)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Custom Key / Code (Optional)</label>
                <input type="text" id="customCode" placeholder="Leave empty for auto 6-digit">
            </div>
            <div class="form-group">
                <label>Expiration (Hours)</label>
                <input type="number" id="expiryHours" placeholder="0 = Never Expires" min="0">
            </div>
            <button class="btn" onclick="generateOTP()">Generate Key</button>
        </div>

        <!-- Key List -->
        <div class="card">
            <h2>Active & Generated OTP Keys</h2>
            <table>
                <thead>
                    <tr>
                        <th>OTP Code</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Uses</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="otpTable">
                    <tr><td colspan="6" style="text-align:center; color:#666;">Loading keys...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchOTPs() {
            const res = await fetch('/api/otps');
            const data = await res.json();
            const tbody = document.getElementById('otpTable');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#666;">No OTP keys generated yet.</td></tr>`;
                return;
            }

            data.forEach(item => {
                let badgeClass = 'badge-active';
                if (item.status === 'used') badgeClass = 'badge-used';
                if (item.status === 'expired' || item.status === 'revoked') badgeClass = 'badge-expired';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="code-tag">${item.code}</span></td>
                    <td>${item.type.toUpperCase()}</td>
                    <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    <td>${item.type === 'single' ? (item.status === 'used' || item.status === 'revoked' ? '1/1' : '0/1') : (item.useCount || 0)}</td>
                    <td>${new Date(item.createdAt).toLocaleString()}</td>
                    <td>
                        ${item.status !== 'revoked' ? `<button class="btn btn-danger" onclick="revokeOTP('${item.id}')" style="margin-right: 5px;">Revoke</button>` : ''}
                        <button class="btn btn-danger" onclick="deleteOTP('${item.id}')" style="background:#555;">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function revokeOTP(id) {
            if (!confirm('Are you sure you want to REVOKE this license? The payload will stop working immediately.')) return;
            await fetch(`/api/otps/${id}/revoke`, { method: 'POST' });
            fetchOTPs();
        }

        async function generateOTP() {
            const type = document.getElementById('otpType').value;
            const customCode = document.getElementById('customCode').value;
            const expiryHours = parseFloat(document.getElementById('expiryHours').value) || 0;

            const res = await fetch('/api/otps/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, customCode, expiryHours })
            });

            if (res.ok) {
                document.getElementById('customCode').value = '';
                fetchOTPs();
            } else {
                const err = await res.json();
                alert(err.error || 'Failed to generate OTP');
            }
        }

        async function deleteOTP(id) {
            if (!confirm('Are you sure you want to revoke this key?')) return;
            await fetch(`/api/otps/${id}`, { method: 'DELETE' });
            fetchOTPs();
        }

        fetchOTPs();
        setInterval(fetchOTPs, 5000);
    </script>
</body>
</html>
